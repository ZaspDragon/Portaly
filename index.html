<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempTrack Pro | Multi-Agency Temp Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">TT</div>
        <div>
          <h1>TempTrack Pro</h1>
          <p>Multi-Agency Workforce Portal</p>
        </div>
      </div>

      <div class="role-card">
        <label for="roleSelect">Demo Role</label>
        <select id="roleSelect">
          <option value="super_admin">Super Admin</option>
          <option value="agency_admin">Agency Admin</option>
          <option value="client_manager">Client Manager</option>
          <option value="worker">Worker</option>
        </select>
      </div>

      <div class="role-card agency-picker">
        <label for="agencySelect">Agency</label>
        <select id="agencySelect"></select>
      </div>

      <nav id="nav"></nav>

      <button class="ghost-btn full" id="resetDemoBtn">Reset Demo Data</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="activeRoleLabel">Super Admin</p>
          <h2 id="pageTitle">Command Center</h2>
        </div>
        <div class="top-actions">
          <button class="secondary-btn" id="exportBtn">Export Payroll CSV</button>
          <button class="primary-btn" data-view="timeclock">Open Timeclock</button>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
