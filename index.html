<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portaly | Agency TimeClock OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-grid"></div>

  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">&#9776;</button>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>
          <p class="sidebar-kicker">Agency Operating System</p>
          <h1>Portaly</h1>
          <p>QR timeclock, approvals, payroll, and margin visibility.</p>
        </div>
      </div>

      <div class="sidebar-status">
        <span class="sidebar-chip">Static deploy</span>
        <span class="sidebar-chip">Multi-role demo</span>
        <span class="sidebar-chip">Agency-ready</span>
      </div>

      <div class="sidebar-section">
        <label for="roleSelect">Demo profile</label>
        <select id="roleSelect">
          <option value="super_admin">Platform Owner</option>
          <option value="agency_admin">Agency Ops</option>
          <option value="client_manager">Client Approver</option>
          <option value="worker">Worker</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label for="agencySelect">Agency</label>
        <select id="agencySelect"></select>
      </div>

      <div class="sidebar-section" id="clientBox">
        <label for="clientSelect">Client account</label>
        <select id="clientSelect"></select>
      </div>

      <div class="sidebar-section" id="workerBox">
        <label for="workerSelect">Worker profile</label>
        <select id="workerSelect"></select>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sidebar-footer">
        <button class="ghost-btn full" id="signOutBtn">Sign Out</button>
        <button class="ghost-btn full" id="resetDemoBtn">Reset Demo Data</button>
        <p>GitHub Pages ready and built for sales demos.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="activeContextLabel">Agency Operating System</p>
          <h2 id="pageTitle">Access Hub</h2>
        </div>

        <div class="top-actions">
          <button class="secondary-btn" id="exportBtn">Export Payroll</button>
          <button class="primary-btn" data-view="timeclock">Open Worker Punch</button>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
