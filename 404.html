<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portaly</title>
  <script>
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var basePath = window.location.hostname.endsWith(".github.io") && parts.length
        ? "/" + parts[0] + "/"
        : "/";
      var routePath = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length)
        : window.location.pathname;
      routePath = String(routePath || "").replace(/^\/+/, "").replace(/\/+$/, "");
      var query = window.location.search || "";
      var target = basePath + "#/" + routePath + query;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
